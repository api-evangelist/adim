name: Adim
description: Adim is an entertainment-technology and web3 media company co-founded in
  2022 by It's Always Sunny in Philadelphia creator Rob McElhenney alongside Richard
  Rosenblatt, Chase Rosenblatt, Melissa Kaspers, and Spencer Marell. Adim invites a
  community of storytellers, writers, and fans to collaboratively create, develop,
  and co-own a new generation of intellectual property — stories, characters, and narrative
  universes known as the Adimverse — rewarding contributors with ownership stakes and
  a say in how the community is governed. The company raised a $5M seed round led by
  Chris Dixon of a16z crypto. Adim is a consumer creative platform rather than an API
  provider; it publishes no public developer API, SDK, or documentation surface as of
  this enrichment pass.
